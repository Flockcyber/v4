<?xml version="1.0" encoding="UTF-8"?>
<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E6D5F5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD4B8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bookGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E2A38;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2C4A6B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="crossGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD07F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5D38C;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="60" cy="60" r="58" fill="url(#bgGradient)"/>

  <!-- Book shape -->
  <rect x="35" y="25" width="50" height="70" rx="3" fill="url(#bookGradient)"/>

  <!-- Book spine highlight -->
  <rect x="35" y="25" width="5" height="70" rx="2" fill="rgba(255,255,255,0.2)"/>

  <!-- Book pages -->
  <rect x="42" y="30" width="38" height="60" fill="#F5EDE0" rx="1"/>

  <!-- Cross on the book -->
  <g>
    <!-- Vertical bar of cross -->
    <rect x="57" y="45" width="6" height="24" rx="1" fill="url(#crossGradient)"/>
    <!-- Horizontal bar of cross -->
    <rect x="52" y="54" width="16" height="6" rx="1" fill="url(#crossGradient)"/>
  </g>

  <!-- Decorative elements - small dots at corners -->
  <circle cx="60" cy="35" r="2" fill="#F5D38C" opacity="0.6"/>
  <circle cx="60" cy="85" r="2" fill="#F5D38C" opacity="0.6"/>
</svg>
